$kind: http-request
url: "{{baseUrl}}/api/v1/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Coffee",
      "price": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("itemId", pm.response.json().data.id);
    language: text/javascript
order: 1000
