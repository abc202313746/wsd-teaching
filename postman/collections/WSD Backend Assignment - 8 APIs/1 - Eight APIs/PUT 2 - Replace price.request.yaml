$kind: http-request
url: "{{baseUrl}}/api/v1/items/{{itemId}}/price"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": 2200
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
