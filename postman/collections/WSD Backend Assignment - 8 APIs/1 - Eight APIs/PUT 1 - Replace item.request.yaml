$kind: http-request
url: "{{baseUrl}}/api/v1/items/{{itemId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Americano",
      "price": 1800
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
